name: Cloud Shipping Scraper UI

on:
  workflow_dispatch:
    inputs:
      shipment_type:
        description: "Shipment Type (1 for LCL/Air, 2 for FCL & Hybrid Mix)"
        required: true
        default: "2"
      origin:
        description: "Origin Code (e.g., ITGOA, CAI)"
        required: true
      destination:
        description: "Destination Code (e.g., EGALY, DXB)"
        required: true
      weight:
        description: "Total Weight in KG (Actual Gross Weight)"
        required: false
        default: "0"
      volume:
        description: "Ziyada Loose Volume in CBM (If Hybrid Mix, else 0)"
        required: false
        default: "0"
      count_20ft:
        description: "Quantity of 20FT Containers"
        required: false
        default: "0"
      count_40ft:
        description: "Quantity of 40FT Containers"
        required: false
        default: "0"
      start_date:
        description: "Start Date (YYYY-MM-DD)"
        required: false
        default: "2026-09-01"
      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: false
        default: "2026-09-15"
      cargo_value:
        description: "Cargo Value in USD/EUR base (For Insurance)"
        required: false
        default: "0"
      target_currency:
        description: "Report Currency Output (USD or EUR)"
        required: true
        default: "EUR"

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        pip install playwright pandas openpyxl
        playwright install chromium

    - name: Execute Cloud Scraper Engine
      run: |
        python shipping_scraper.py "${{ github.event.inputs.shipment_type }}" "${{ github.event.inputs.origin }}" "${{ github.event.inputs.destination }}" "${{ github.event.inputs.weight }}" "${{ github.event.inputs.volume }}" "${{ github.event.inputs.count_20ft }}" "${{ github.event.inputs.count_40ft }}" "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}" "${{ github.event.inputs.cargo_value }}" "${{ github.event.inputs.target_currency }}"
