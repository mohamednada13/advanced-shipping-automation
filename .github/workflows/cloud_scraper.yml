name: Cloud Shipping Scraper UI

on:
  workflow_dispatch:
    inputs:
      shipment_type:
        description: "Shipment Type (1 for LCL/Air, 2 for FCL)"
        required: true
        default: "1"
      origin:
        description: "Origin Code (e.g., ITGOA, CAI)"
        required: true
      destination:
        description: "Destination Code (e.g., EGALY, DXB)"
        required: true
      weight:
        description: "Weight in KG"
        required: false
        default: "0"
      volume:
        description: "Volume in CBM"
        required: false
        default: "0"
      container_size:
        description: "Container Size (1 for 20FT, 2 for 40HC)"
        required: false
        default: "0"
      start_date:
        description: "Start Date (YYYY-MM-DD)"
        required: false
        default: "2026-09-01"
      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: false
        default: "2026-09-15"
      cargo_value:
        description: "Cargo Value in USD (For Insurance)"
        required: false
        default: "5000"

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        pip install playwright pandas openpyxl
        playwright install chromium

    - name: Execute Cloud Scraper Engine
      run: |
        python shipping_scraper.py "${{ github.event.inputs.shipment_type }}" "${{ github.event.inputs.origin }}" "${{ github.event.inputs.destination }}" "${{ github.event.inputs.weight }}" "${{ github.event.inputs.volume }}" "${{ github.event.inputs.container_size }}" "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}" "${{ github.event.inputs.cargo_value }}"
