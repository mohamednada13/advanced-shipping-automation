name: Cloud Shipping Scraper UI

on:
  workflow_dispatch:
    inputs:
      shipment_mode:
        description: "Select Shipping Mode (الرجاء اختيار نوع الشحن)"
        required: true
        type: choice
        options:
          - "Ocean"
          - "Air"
        default: "Ocean"
      origin:
        description: "Origin Code (e.g., ITGOA, CAI)"
        required: true
      destination:
        description: "Destination Code (e.g., EGALY, DXB)"
        required: true
      weight:
        description: "Total Shipment Weight in KG"
        required: false
        default: "0"
      volume:
        description: "Total Volume in CBM (Required for Ocean LCL / Optional for Mix)"
        required: false
        default: "0"
      count_20ft:
        description: "Quantity of 20FT Containers (Leave 0 for Air/LCL)"
        required: false
        default: "0"
      count_40ft:
        description: "Quantity of 40FT Containers (Leave 0 for Air/LCL)"
        required: false
        default: "0"
      start_date:
        description: "Start Date (YYYY-MM-DD)"
        required: false
        default: "2026-09-01"
      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: false
        default: "2026-09-15"
      cargo_value:
        description: "Cargo Value (For Insurance calculation)"
        required: false
        default: "0"
      target_currency:
        description: "Report Currency Output"
        required: true
        type: choice
        options:
          - "EUR"
          - "USD"
        default: "EUR"

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        pip install playwright pandas openpyxl
        playwright install chromium

    - name: Execute Cloud Scraper Engine
      run: |
        # الكود يقوم تلقائيا بتحويل النص المختار (Ocean أو Air) إلى القيمة الرقمية المعتمدة في السكربت لتفادي أي لخبطة
        SHIP_TYPE_NUM="2"
        if [ "${{ github.event.inputs.shipment_mode }}" = "Air" ]; then
          SHIP_TYPE_NUM="1"
        elif [ "${{ github.event.inputs.count_20ft }}" = "0" ] && [ "${{ github.event.inputs.count_40ft }}" = "0" ]; then
          # ذكاء إضافي: إذا اختار بحري وترك الحاويات بأصفار، السيرفر يفهم تلقائيا أنها شحنة مجزأة LCL
          SHIP_TYPE_NUM="1"
        fi
        
        python shipping_scraper.py "$SHIP_TYPE_NUM" "${{ github.event.inputs.origin }}" "${{ github.event.inputs.destination }}" "${{ github.event.inputs.weight }}" "${{ github.event.inputs.volume }}" "${{ github.event.inputs.count_20ft }}" "${{ github.event.inputs.count_40ft }}" "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}" "${{ github.event.inputs.cargo_value }}" "${{ github.event.inputs.target_currency }}"
