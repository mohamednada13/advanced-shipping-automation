name: 1. Air Freight Scraper UI

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Airport of Departure (AOD) - (3-4 chars)"
        required: true
        default: "CAI"
      destination:
        description: "Airport of Destination - (3-4 chars)"
        required: true
        default: "LHR"
      weight:
        description: "Total Weight KG"
        required: true
        default: "100"
      volume:
        description: "Total Volume CBM"
        required: false
        default: "1"
      start_date:
        description: "Flight Date (YYYY-MM-DD)"
        required: false
        default: "2026-09-01"
      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: false
        default: "2026-09-15"
      cargo_value:
        description: "Cargo Value"
        required: false
        default: "0"
      target_currency:
        description: "Currency"
        required: true
        type: choice
        options:
          - "EUR"
          - "USD"
        default: "EUR"

jobs:
  run-air-scraper:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - run: pip install playwright pandas openpyxl requests && playwright install chromium
    - name: Run Scraper
      env:
        # Connecting your script to the secure repository secret vault
        GMAIL_PASSWORD_TOKEN: ${{ secrets.GMAIL_PASSWORD_TOKEN }}
      run: python shipping_scraper.py "1" "${{ github.event.inputs.origin }}" "${{ github.event.inputs.destination }}" "${{ github.event.inputs.weight }}" "${{ github.event.inputs.volume }}" "0" "0" "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}" "${{ github.event.inputs.cargo_value }}" "${{ github.event.inputs.target_currency }}"
