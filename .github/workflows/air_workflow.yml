name: 1. Air Freight Scraper UI

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Airport of Departure (AOD) - (3-4 chars)"
        required: true
        default: "CAI"
      destination:
        description: "Airport of Destination - (3-4 chars)"
        required: true
        default: "LHR"
      weight:
        description: "Total Weight KG"
        required: true
        default: "100"
      volume:
        description: "Total Volume CBM"
        required: false
        default: "1"
      cargo_value:
        description: "Cargo Value"
        required: false
        default: "0"
      target_currency:
        description: "Currency"
        required: true
        type: choice
        options:
          - "EUR"
          - "USD"
        default: "EUR"

jobs:
  run-air-scraper:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - run: pip install playwright pandas openpyxl requests && playwright install chromium
    - name: Run Scraper Engine with Dynamic Today Date
      env:
        GMAIL_PASSWORD_TOKEN: ${{ secrets.GMAIL_PASSWORD_TOKEN }}
        SHIPPING_API_KEY: ${{ secrets.SHIPPING_API_KEY }}
      run: |
        # توليد تاريخ اليوم وتاريخ نهاية الصلاحية (بعد 14 يوم) آلياً وديناميكياً في ثانية التشغيل
        TODAY_DATE=$(date +'%Y-%m-%d')
        END_DATE=$(date -d "+14 days" +'%Y-%m-%d')
        python shipping_scraper.py "1" "${{ github.event.inputs.origin }}" "${{ github.event.inputs.destination }}" "${{ github.event.inputs.weight }}" "${{ github.event.inputs.volume }}" "0" "0" "$TODAY_DATE" "$END_DATE" "${{ github.event.inputs.cargo_value }}" "${{ github.event.inputs.target_currency }}"
