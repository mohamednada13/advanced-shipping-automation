name: 2. Ocean Freight Scraper UI
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Ocean Port Code (e.g., ITGOA, EGALY)"
        required: true
      destination:
        description: "Ocean Port Code (e.g., SHA, ROT)"
        required: true
      count_20ft:
        description: "Quantity of 20FT Containers"
        required: false
        default: "0"
      count_40ft:
        description: "Quantity of 40FT Containers"
        required: false
        default: "0"
      weight:
        description: "Total Shipment Weight in KG"
        required: false
        default: "0"
      volume:
        description: "Total Volume in CBM"
        required: false
        default: "0"
      start_date:
        description: "Start Date (YYYY-MM-DD)"
        required: false
        default: "2026-09-01"
      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: false
        default: "2026-09-15"
      cargo_value:
        description: "Cargo Value (For Insurance calculation)"
        required: false
        default: "0"
      target_currency:
        description: "Report Currency Output"
        required: true
        type: choice
        options: ["EUR", "USD"]
        default: "EUR"
jobs:
  run-ocean-scraper:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with: {python-version: "3.10"}
    - run: pip install playwright pandas openpyxl && playwright install chromium
    - run: |
        SHIP_TYPE_NUM="2"
        if [ "${{ github.event.inputs.count_20ft }}" = "0" ] && [ "${{ github.event.inputs.count_40ft }}" = "0" ]; then SHIP_TYPE_NUM="1"; fi
        python shipping_scraper.py "$SHIP_TYPE_NUM" "${{ github.event.inputs.origin }}" "${{ github.event.inputs.destination }}" "${{ github.event.inputs.weight }}" "${{ github.event.inputs.volume }}" "${{ github.event.inputs.count_20ft }}" "${{ github.event.inputs.count_40ft }}" "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}" "${{ github.event.inputs.cargo_value }}" "${{ github.event.inputs.target_currency }}"
